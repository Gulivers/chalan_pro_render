version: '3.8'

# ============================================
# Chalan-Pro Multi-tenant Docker Compose
# ============================================
# Este archivo define la infraestructura multi-tenant
# con nginx-proxy, múltiples tenants y servicios compartidos
# ============================================

services:
  # ============================================
  # Servicios Compartidos
  # ============================================

  # PostgreSQL Multi-tenant Database
  db:
    image: postgres:15-alpine
    container_name: chalan-multitenant-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-chalan_tenant_db}
      - POSTGRES_USER=${POSTGRES_USER:-chalan_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-chalan_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-tenant-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chalan_user} -d ${POSTGRES_DB:-chalan_tenant_db}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - nginx-proxy

  # Redis Cache (compartido, separado por DB number)
  redis:
    image: redis:7.4-alpine
    container_name: chalan-multitenant-redis
    volumes:
      - redis-data:/data
    networks:
      - nginx-proxy

  # Nginx Reverse Proxy (jwilder/nginx-proxy)
  nginx-proxy:
    image: jwilder/nginx-proxy:latest
    container_name: chalan-nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./docker/nginx/vhost.d:/etc/nginx/vhost.d
      - ./docker/nginx/html:/usr/share/nginx/html
      - nginx-proxy-conf:/etc/nginx/conf.d
    networks:
      - nginx-proxy
    restart: unless-stopped

  # Let's Encrypt Companion (SSL automático)
  nginx-proxy-letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion:latest
    container_name: chalan-letsencrypt
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/nginx/certs:/etc/nginx/certs:rw
      - ./docker/nginx/vhost.d:/etc/nginx/vhost.d
      - ./docker/nginx/html:/usr/share/nginx/html
      - nginx-proxy-conf:/etc/nginx/conf.d
    environment:
      - NGINX_PROXY_CONTAINER=chalan-nginx-proxy
    networks:
      - nginx-proxy
    depends_on:
      - nginx-proxy
    restart: unless-stopped

  # PgAdmin (Gestión de base de datos)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: chalan-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@chalan.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin123}
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    networks:
      - nginx-proxy
    depends_on:
      - db
    restart: unless-stopped

  # ============================================
  # Tenant: Phoenix Electric
  # ============================================

  web-phoenix:
    build:
      context: .
      dockerfile: Dockerfile
    image: chalanpro:${VERSION:-2.0.0}
    container_name: chalan-phoenix-web
    command: sh -c "python manage.py migrate_schemas && python manage.py runserver 0.0.0.0:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=project.settings.${ENVIRONMENT:-local}
      - VIRTUAL_HOST=${PHOENIX_API_DOMAIN:-api.phoenix.localhost}
      - LETSENCRYPT_HOST=${PHOENIX_API_DOMAIN:-api.phoenix.localhost}
      - TENANT_SCHEMA=tenant_phoenix
      - TENANT_ID=phoenix_001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-chalan_user}:${POSTGRES_PASSWORD:-chalan_password}@db:5432/${POSTGRES_DB:-chalan_tenant_db}
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG:-False}
    volumes:
      - .:/app
      - ./logs/phoenix:/app/logs
      - ./media/phoenix:/app/media/phoenix
    networks:
      - nginx-proxy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  nginx-phoenix:
    image: nginx:1.19.0-alpine
    container_name: chalan-phoenix-nginx
    volumes:
      - ./vuefrontend/dist:/usr/share/nginx/html:ro
      - ./vuefrontend/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VIRTUAL_HOST=${PHOENIX_DOMAIN:-phoenix.localhost},www.${PHOENIX_DOMAIN:-phoenix.localhost}
      - LETSENCRYPT_HOST=${PHOENIX_DOMAIN:-phoenix.localhost},www.${PHOENIX_DOMAIN:-phoenix.localhost}
      - TENANT_SCHEMA=tenant_phoenix
    networks:
      - nginx-proxy
    depends_on:
      - web-phoenix
    restart: unless-stopped

  # ============================================
  # Tenant: Client2 (Ejemplo)
  # ============================================

  web-client2:
    build:
      context: .
      dockerfile: Dockerfile
    image: chalanpro:${VERSION:-2.0.0}
    container_name: chalan-client2-web
    command: sh -c "python manage.py migrate_schemas && python manage.py runserver 0.0.0.0:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=project.settings.${ENVIRONMENT:-local}
      - VIRTUAL_HOST=${CLIENT2_API_DOMAIN:-api.client2.localhost}
      - LETSENCRYPT_HOST=${CLIENT2_API_DOMAIN:-api.client2.localhost}
      - TENANT_SCHEMA=tenant_client2
      - TENANT_ID=client2_001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-chalan_user}:${POSTGRES_PASSWORD:-chalan_password}@db:5432/${POSTGRES_DB:-chalan_tenant_db}
      - REDIS_URL=redis://redis:6379/1
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG:-False}
    volumes:
      - .:/app
      - ./logs/client2:/app/logs
      - ./media/client2:/app/media/client2
    networks:
      - nginx-proxy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  nginx-client2:
    image: nginx:1.19.0-alpine
    container_name: chalan-client2-nginx
    volumes:
      - ./vuefrontend/dist:/usr/share/nginx/html:ro
      - ./vuefrontend/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VIRTUAL_HOST=${CLIENT2_DOMAIN:-client2.localhost},www.${CLIENT2_DOMAIN:-client2.localhost}
      - LETSENCRYPT_HOST=${CLIENT2_DOMAIN:-client2.localhost},www.${CLIENT2_DOMAIN:-client2.localhost}
      - TENANT_SCHEMA=tenant_client2
    networks:
      - nginx-proxy
    depends_on:
      - web-client2
    restart: unless-stopped

  # ============================================
  # Worker Celery (Opcional - para tareas asíncronas)
  # ============================================

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: chalanpro:${VERSION:-2.0.0}
    container_name: chalan-worker
    command: celery -A project worker -l info
    environment:
      - DJANGO_SETTINGS_MODULE=project.settings.${ENVIRONMENT:-local}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-chalan_user}:${POSTGRES_PASSWORD:-chalan_password}@db:5432/${POSTGRES_DB:-chalan_tenant_db}
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
    volumes:
      - .:/app
    networks:
      - nginx-proxy
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  nginx-proxy-conf:

networks:
  nginx-proxy:
    external: false
    name: chalan-nginx-proxy

