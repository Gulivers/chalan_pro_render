services:
  postgres:
    image: postgres:16
    container_name: chalan_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - chalan-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - chalan-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: chalan-pgadmin
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@chalan.com
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chalan-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chalan-backend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: project.settings.local
      ENVIRONMENT: local
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      USE_POWERSHELL: "true"  # Forzar uso de PowerShell en Windows para scripts Docker
      HOST_OS: "Windows"  # Indicar que el host es Windows
      DEBUG: ${DJANGO_DEBUG:-True}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@chalan_postgres:5432/${POSTGRES_DB}
      POSTGRES_HOST: chalan_postgres
      REDIS_URL: redis://redis:6379/0
      ENABLE_WEBSOCKET_NOTIFICATIONS: "True"
    command: sh -c "python manage.py migrate_schemas --schema=public && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      # Montar socket de Docker para permitir crear contenedores desde dentro del contenedor
      # En Windows con Docker Desktop, usar: //var/run/docker.sock:/var/run/docker.sock
      # En Linux/Mac, usar: /var/run/docker.sock:/var/run/docker.sock
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - chalan-network

  frontend:
    image: node:18-alpine
    container_name: chalan-frontend
    working_dir: /app
    command: sh -c "npm ci && npm run serve -- --host 0.0.0.0 --port 3000"
    volumes:
      - ./vuefrontend:/app
      - chalan-frontend-node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
    networks:
      - chalan-network

  redis:
    image: redis:7.4-alpine
    container_name: chalan-redis
    command: ["redis-server", "--save", "20", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - chalan-redis-data:/data
    networks:
      - chalan-network

networks:
  chalan-network:
    driver: bridge

volumes:
  chalan-postgres-data:
  chalan-frontend-node_modules:
  chalan-redis-data: